<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SKILL ISSUE · Votación</title><style>
:root{color-scheme:dark;font-family:Segoe UI,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;color:#e9e5dc;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#26405b,#080e18 72%)}main{max-width:580px;margin:auto;padding:42px 18px}.eyebrow{text-align:center;color:#d7b77a;letter-spacing:.23em;font-size:12px}h1{text-align:center;color:#f2dcb0;font:700 clamp(28px,7vw,44px) Georgia,serif}p{color:#b4c3d1;text-align:center;line-height:1.6}.panel{padding:25px;background:linear-gradient(145deg,#1a2b3b,#101a28);border:1px solid #a18a61;border-radius:8px;box-shadow:0 12px 50px #0008}label{display:block;color:#ebd5a7;margin:18px 0 8px}input,select,button{font:inherit;width:100%;padding:13px;border-radius:5px}input,select{background:#0b1523;color:white;border:1px solid #607185}button{margin-top:22px;background:linear-gradient(#f5d99b,#ac8045);color:#17191d;border:0;font-weight:800;cursor:pointer}button:disabled{opacity:.55}#msg{margin-top:15px;white-space:pre-wrap;color:#f1d8a2}small{color:#9eafc2;display:block;margin-top:20px}</style></head><body><main><div class="eyebrow">✦ SKILL ISSUE · ALL SAINTS' WAKE ✦</div><h1>🎭 El desfile de los horrores</h1><p>Vota por tu glamour favorito. Tu elección no será pública.</p><div class="panel"><form id="form"><label for="code">Código privado</label><input id="code" required autocomplete="off" placeholder="SI-..."><label for="candidate">Tu glamour favorito</label><select id="candidate" required><option value="">Cargando participantes...</option></select><button id="send" type="submit">✦ CONFIRMAR VOTO ✦</button></form><div id="msg" role="status" aria-live="polite"></div></div><small>Un voto por código. No puedes votarte a ti mismo. El administrador de la base de datos puede consultar los votos individuales; el anonimato es frente a los participantes.</small></main><script src="skill_issue_config.js"></script><script>
(()=>{'use strict';const cfg=window.SKILL_ISSUE_CONFIG||{},msg=document.getElementById('msg'),sel=document.getElementById('candidate'),btn=document.getElementById('send');function show(t){msg.textContent=t}async function rpc(fn,args){const r=await fetch(cfg.url.replace(/\/$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',headers:{'Content-Type':'application/json','apikey':cfg.anonKey,'Authorization':'Bearer '+cfg.anonKey},body:JSON.stringify(args||{})});if(!r.ok)throw Error('HTTP '+r.status+' '+(await r.text()).slice(0,180));return r.json()};async function load(){if(!cfg.url?.startsWith('https://')||!cfg.anonKey||cfg.anonKey.startsWith('TU_')){show('El organizador todavía no ha configurado Supabase.');return}try{const x=await rpc('si_public_ballot');sel.replaceChildren(new Option('Selecciona un participante',''));(x?.candidates||[]).forEach(p=>sel.add(new Option(p.name,p.id)));btn.disabled=!x?.is_open;show(x?.is_open?'Votación abierta. ¡Suerte!':'La votación está cerrada.')}catch(e){show('Error de conexión: '+e.message)}}document.getElementById('form').onsubmit=async e=>{e.preventDefault();btn.disabled=true;try{const x=await rpc('si_cast_vote',{p_code:document.getElementById('code').value,p_candidate:sel.value});const texts={OK:'¡Voto registrado correctamente! 🎃',CLOSED:'La votación está cerrada.',BAD_CODE:'Código incorrecto.',USED:'Este código ya ha votado.',SELF:'No puedes votarte a ti mismo.',INVALID:'Candidato no válido.'};show(texts[x]||'Respuesta desconocida');if(x==='OK'){document.getElementById('form').reset();document.getElementById('code').disabled=true;sel.disabled=true}else btn.disabled=false}catch(err){show('No se pudo enviar: '+err.message);btn.disabled=false}};load()})();
</script></body></html>
